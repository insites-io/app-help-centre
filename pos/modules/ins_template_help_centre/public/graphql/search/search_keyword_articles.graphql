query search_via_keyword_articles (
  $id: ID,
  $page: Int = 1,
  $size: Int = 5,
  $keyword: String,
  $schema: String
) {
  items: models(
    page: $page,
    per_page: $size,
    filter: {
      id: { 
        value: $id
      },
      deleted_at: { 
        exists: false
      },
      model_schema_name: { 
        value: $schema 
      },
      or: [
        {
          properties: [
            { 
              name: "post_title",
              contains: $keyword
            }
          ]
        },
        {
          properties: [
            { 
              name: "content",
              contains: $keyword
            }
          ]
        }
      ]
    }
  ) {
    total_entries
    total_pages
    current_page
    has_next_page
    has_previous_page
    per_page
    results {
      id 
      properties
    }
  }
}