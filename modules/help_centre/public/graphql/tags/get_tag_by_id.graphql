query get_tag_by_id($id: ID!) {
  items: models(
    per_page: 1,
    filter: {
      id: {
        value: $id
      }
      deleted_at: {
        exists: false
      },
      model_schema_name: {
        value: "modules/help_centre/tags"
      }
    }
  ) {
    total_entries
    results {
			id
      properties
    }
  }
}