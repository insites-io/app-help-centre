query get_tags {
  items: records(
    per_page: 100,
    filter: {
      deleted_at: {
        exists: false
      },
      table: {
        value: "modules/help_centre/tags"
      }
    }
  ) {
    results {
      id
      name: property(name: "name")
      color: property(name: "color")
      icon: property(name: "icon")
    }
  }
}