query get_documentation(
	$page: Int = 1,
	$size: Int = 1,
	$slug: String
) {
  items: records(
    page: $page,
    per_page: $size,
    filter: {
      deleted_at: {
        exists: false
      },
      table: {
        value: "modules/ins_template_help_centre/documentation"
      },
      properties: [
        {name: "slug", value: $slug}
      ]
    }
  ) {
    total_entries
    total_pages
    current_page
    has_next_page
    has_previous_page
    per_page
    results {
      updated_at
      properties
    }
  }
}