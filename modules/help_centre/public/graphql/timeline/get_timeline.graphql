query get_timeline(
  $page: Int = 1, 
  $size: Int = 10, 
  $slug: String
) {
  items: records(
    page: $page,
    per_page: $size,
    filter: {
      deleted_at: {
        exists: false
      },
      table: {
        value: "modules/help_centre/timeline"
      },
      properties: [
        {
          name: "status",
          value: "Published"
        },
        {
          name: "slug",
          value: $slug
        }
      ]
    }
  ) {
    total_entries
    total_pages
    current_page
    has_next_page
    has_previous_page
    per_page
    results {
      updated_at
      properties
    }
  }
}