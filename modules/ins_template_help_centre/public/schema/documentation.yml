properties:
- name: author
  type: string
  metadata:
    label: "Author"
    weight: 2
    group_id: "0fa0e29f-c88f-4056-8fa7-29856949d08d"
    ui_element: "input"
    is_required: true
    is_shown_in_table: false
- name: canonical_url
  type: string
  metadata:
    label: "Canonical URL"
    weight: 15
    group_id: "0e715a53-67d8-488a-9508-b8de173f5a02"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "You can learn more about canonical URL's from Google here - https://developers.google.com/search/docs/advanced/crawling/consolidate-duplicate-urls"
    is_shown_in_table: false
- name: content
  type: string
  metadata:
    label: "Content"
    weight: 5
    group_id: "0fa0e29f-c88f-4056-8fa7-29856949d08d"
    ui_element: "markdown"
    is_required: true
- name: menu_label
  type: string
  metadata:
    label: "Menu Label"
    weight: 8
    group_id: "15296e58-7425-448d-b912-48952adca3a9"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "Utilise this field when you would like to set a different label for your contents menu item. If not set, it will use the \"Title\" field."
    is_shown_in_table: false
- name: meta_description
  type: string
  metadata:
    label: "Meta Description"
    weight: 14
    group_id: "0e715a53-67d8-488a-9508-b8de173f5a02"
    ui_element: "multi_line"
    is_required: false
    help_text_tooltip: "Short description about your content that will be referenced by search engines."
- name: meta_title
  type: string
  metadata:
    label: "Meta Title"
    weight: 13
    group_id: "0e715a53-67d8-488a-9508-b8de173f5a02"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "A good title has between 40-60 characters."
    is_shown_in_table: false
- name: ogdescription
  type: string
  metadata:
    label: "og:description"
    weight: 17
    group_id: "37b855dc-f263-4743-bc07-6c0f71ff8cdc"
    ui_element: "multi_line"
    is_required: false
    help_text_tooltip: "This is the 1-2 sentence snippet that shows on a post when shared on social media."
- name: og_image
  type: upload
  metadata:
    label: "og: image"
    weight: 21
    group_id: "37b855dc-f263-4743-bc07-6c0f71ff8cdc"
    ui_element: "media_image"
    is_required: false
    max_file_size: 10
    help_text_tooltip: "The URL for an image you want to represent your content when shared on social media. Images must be either PNG, JPEG and GIF formats and at least 50px by 50px."
  options:
    acl: public
    cache_control: ""
    content_disposition: inline
- name: og_site_name
  type: string
  metadata:
    label: "og: site_name"
    weight: 20
    group_id: "37b855dc-f263-4743-bc07-6c0f71ff8cdc"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "The name of your site when shared on social media."
    is_shown_in_table: false
- name: og_title
  type: string
  metadata:
    label: "og: title"
    weight: 16
    group_id: "37b855dc-f263-4743-bc07-6c0f71ff8cdc"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "The title of your content when shared on social media."
    is_shown_in_table: false
- name: og_type
  type: string
  metadata:
    label: "og: type"
    weight: 18
    group_id: "37b855dc-f263-4743-bc07-6c0f71ff8cdc"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "The type of content. Think of these as categories, hotel, blog, article etc."
    is_shown_in_table: false
- name: og_url
  type: string
  metadata:
    label: "og: url"
    weight: 19
    group_id: "37b855dc-f263-4743-bc07-6c0f71ff8cdc"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "This will be the URL that will be associated with your content when shared on social media."
    is_shown_in_table: false
- name: order
  type: integer
  metadata:
    label: "Order"
    weight: 7
    group_id: "15296e58-7425-448d-b912-48952adca3a9"
    ui_element: "number"
    is_required: false
    help_text_tooltip: "Use this field when you would like to sort the order of the content."
    is_shown_in_table: false
- name: parent_category
  type: string
  belongs_to: modules/ins_databases/documentation
  metadata:
    label: "Parent Category"
    weight: 9
    group_id: "15296e58-7425-448d-b912-48952adca3a9"
    ui_element: "select_data_source"
    is_required: false
    display_field: "title"
    help_text_tooltip: "Setting the Parent Category will define where your content is displayed within the heircharcy of content."
    is_shown_in_table: false
- name: publish_date
  type: date
  metadata:
    label: "Publish Date"
    weight: 3
    group_id: "0fa0e29f-c88f-4056-8fa7-29856949d08d"
    ui_element: "date"
    is_required: true
    help_text_tooltip: "Enter the date that you would like to have your content published. Setting a date in the future will release the content on that date."
    is_shown_in_table: false
- name: section
  type: string
  metadata:
    label: "Section"
    weight: 10
    options: ["Developer","Templates"]
    group_id: "15296e58-7425-448d-b912-48952adca3a9"
    ui_element: "select"
    is_required: true
    is_shown_in_table: false
- name: short_description
  type: string
  metadata:
    label: "Short Description"
    weight: 4
    group_id: "0fa0e29f-c88f-4056-8fa7-29856949d08d"
    ui_element: "input"
    is_required: true
    is_shown_in_table: false
- name: shown_in_footer_menu
  type: boolean
  metadata:
    label: "Shown in Footer Menu"
    weight: 12
    group_id: "15296e58-7425-448d-b912-48952adca3a9"
    ui_element: "toggle"
    is_shown_in_table: false
- name: shown_in_sidebar_menu
  type: boolean
  metadata:
    label: "Shown in Sidebar Menu"
    weight: 11
    group_id: "15296e58-7425-448d-b912-48952adca3a9"
    ui_element: "toggle"
    help_text_tooltip: "Toggle for Documentation's Visibility in sidebar menu."
    is_shown_in_table: false
- name: slug
  type: string
  metadata:
    label: "Slug"
    weight: 0
    group_id: "0fa0e29f-c88f-4056-8fa7-29856949d08d"
    ui_element: "input"
    is_required: true
    help_text_tooltip: "You can define the slug of your content. The slug is the part that comes at the very end of a URL. It is human-readable, a unique identifier and used to identify this content. For example, your URL may look like the following https://website.com/category/<slug>"
    is_shown_in_table: false
- name: status
  type: string
  metadata:
    label: "Status"
    weight: 6
    options: ["Published","Unpublished","Draft"]
    group_id: "15296e58-7425-448d-b912-48952adca3a9"
    ui_element: "select"
    is_required: false
    help_text_tooltip: "You can utilise the 'draft' status when you would like to work on some content before releasing it. To to preview your draft content on your websute, add \"?preview=true\" to the contents URL."
    is_shown_in_table: false
- name: title
  type: string
  metadata:
    label: "Title"
    weight: 1
    group_id: "0fa0e29f-c88f-4056-8fa7-29856949d08d"
    ui_element: "input"
    is_required: true
    is_sortable: true
    is_searchable: true
    is_shown_in_table: true
