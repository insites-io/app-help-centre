name: timeline
metadata:
  label: "Timeline"
  groups: [{"id":"ee5eec9d-4f92-4d78-bbf7-1215bc9c54f5","name":"Post Content","weight":0},{"id":"ab402b4f-761b-49d2-91b4-cc3c052c8071","name":"Post Settings","weight":1},{"id":"7b530dfa-5fdc-4400-ba36-870e1abd6ed3","name":"SEO Settings","weight":2},{"id":"3b4e83aa-ae8a-4fd2-baa3-dadb1f0bffec","name":"Open Graph","weight":3}]
  is_archived: false
properties:
- name: author
  type: string
  metadata:
    label: "Author"
    weight: 6
    group_id: "ee5eec9d-4f92-4d78-bbf7-1215bc9c54f5"
    ui_element: "input"
    is_required: false
    is_shown_in_table: false
- name: canonical_url
  type: string
  metadata:
    label: "Canonical URL"
    weight: 12
    group_id: "7b530dfa-5fdc-4400-ba36-870e1abd6ed3"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "You can learn more about canonical URL's from Google here - https://developers.google.com/search/docs/advanced/crawling/consolidate-duplicate-urls"
    is_shown_in_table: false
- name: category
  type: string
  metadata:
    label: "Category"
    weight: 9
    options: ["Templates","Modules","Components"]
    group_id: "ab402b4f-761b-49d2-91b4-cc3c052c8071"
    ui_element: "select"
    is_required: false
    help_text_tooltip: "Use categories to orgainse your content into relevant groups."
    is_shown_in_table: false
- name: detailed_content
  type: string
  metadata:
    label: "Detailed Content"
    weight: 5
    group_id: "ee5eec9d-4f92-4d78-bbf7-1215bc9c54f5"
    ui_element: "markdown"
    is_required: false
- name: enable_details_page
  type: boolean
  metadata:
    label: "Enable Details Page"
    weight: 7
    group_id: "ab402b4f-761b-49d2-91b4-cc3c052c8071"
    ui_element: "toggle"
    help_text_tooltip: "Toggle this field to enable/disable a details page. If this is disabled the heading will not clickable."
    is_shown_in_table: false
- name: meta_description
  type: string
  metadata:
    label: "Meta Description"
    weight: 11
    group_id: "7b530dfa-5fdc-4400-ba36-870e1abd6ed3"
    ui_element: "multi_line"
    is_required: false
    help_text_tooltip: "Short description about your content that will be referenced by search engines."
- name: meta_title
  type: string
  metadata:
    label: "Meta Title"
    weight: 10
    group_id: "7b530dfa-5fdc-4400-ba36-870e1abd6ed3"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "A good title has between 40-60 characters."
    is_shown_in_table: false
- name: og_description
  type: string
  metadata:
    label: "og: description"
    weight: 14
    group_id: "3b4e83aa-ae8a-4fd2-baa3-dadb1f0bffec"
    ui_element: "multi_line"
    is_required: false
    help_text_tooltip: "This is the 1-2 sentence snippet that shows on a post when shared on social media."
- name: ogimage
  type: upload
  metadata:
    label: "og:image"
    weight: 18
    group_id: "3b4e83aa-ae8a-4fd2-baa3-dadb1f0bffec"
    ui_element: "media_image"
    is_required: false
    max_file_size: 10
    help_text_tooltip: "The URL for an image you want to represent your content when shared on social media. Images must be either PNG, JPEG and GIF formats and at least 50px by 50px."
  options:
    acl: public
    cache_control: ""
    content_disposition: inline
- name: og_site_name
  type: string
  metadata:
    label: "og: site_name"
    weight: 17
    group_id: "3b4e83aa-ae8a-4fd2-baa3-dadb1f0bffec"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "The name of your site when shared on social media."
    is_shown_in_table: false
- name: og_title
  type: string
  metadata:
    label: "og: title"
    weight: 13
    group_id: "3b4e83aa-ae8a-4fd2-baa3-dadb1f0bffec"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "The title of your content when shared on social media."
    is_shown_in_table: false
- name: og_type
  type: string
  metadata:
    label: "og: type"
    weight: 15
    group_id: "3b4e83aa-ae8a-4fd2-baa3-dadb1f0bffec"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "The type of content. Think of these as categories, hotel, blog, article etc."
    is_shown_in_table: false
- name: og_url
  type: string
  metadata:
    label: "og: url"
    weight: 16
    group_id: "3b4e83aa-ae8a-4fd2-baa3-dadb1f0bffec"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "This will be the URL that will be associated with your content when shared on social media."
    is_shown_in_table: false
- name: release_date
  type: date
  metadata:
    label: "Release Date"
    weight: 3
    group_id: "ee5eec9d-4f92-4d78-bbf7-1215bc9c54f5"
    ui_element: "date"
    is_required: true
    help_text_tooltip: "Enter the date that you would like to have your content published. Setting a date in the future will release the content on that date."
    is_shown_in_table: false
- name: slug
  type: string
  metadata:
    label: "Slug"
    weight: 0
    group_id: "ee5eec9d-4f92-4d78-bbf7-1215bc9c54f5"
    ui_element: "input"
    is_required: false
    help_text_tooltip: "You can define the slug of your content. The slug is the part that comes at the very end of a URL. It is human-readable, a unique identifier and used to identify this content. For example, your URL may look like the following https://website.com/category/<slug>"
    is_shown_in_table: false
- name: status
  type: string
  metadata:
    label: "Status"
    weight: 8
    options: ["Published","Unpublished","Draft"]
    group_id: "ab402b4f-761b-49d2-91b4-cc3c052c8071"
    ui_element: "select"
    is_required: false
    help_text_tooltip: "You can utilise the 'draft' status when you would like to work on some content before releasing it. To to preview your draft content on your websute, add \"?preview=true\" to the contents URL."
    is_shown_in_table: false
- name: tags
  type: string
  belongs_to: modules/ins_databases/tags
  metadata:
    label: "Tags"
    weight: 1
    group_id: "ee5eec9d-4f92-4d78-bbf7-1215bc9c54f5"
    ui_element: "select_data_source"
    is_required: true
    display_field: "name"
    help_text_tooltip: "Tag your content to help users understand the relevance and aid in content organisation."
    is_shown_in_table: false
- name: timeline_content
  type: string
  metadata:
    label: "Timeline Content"
    weight: 4
    group_id: "ee5eec9d-4f92-4d78-bbf7-1215bc9c54f5"
    ui_element: "markdown"
    is_required: true
- name: title
  type: string
  metadata:
    label: "Title"
    weight: 2
    group_id: "ee5eec9d-4f92-4d78-bbf7-1215bc9c54f5"
    ui_element: "input"
    is_required: false
    is_sortable: true
    is_searchable: true
    is_shown_in_table: true
